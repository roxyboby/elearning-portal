<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - E-Learning Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-strength {
            height: 5px;
            border-radius: 3px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-lock fa-3x text-success"></i>
                        </div>
                        <h2 class="text-center mb-2">Set New Password</h2>
                        <p class="text-center text-muted mb-4">
                            Resetting password for: <strong>{{ email }}</strong>
                        </p>
                        
                        <form method="POST" id="resetForm">
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-lock me-2"></i>New Password
                                </label>
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       name="new_password" 
                                       id="newPassword"
                                       placeholder="Enter new password"
                                       required
                                       minlength="6">
                                <div class="password-strength mt-2" id="strengthBar"></div>
                                <small class="form-text text-muted">
                                    Password must be at least 6 characters long
                                </small>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">
                                    <i class="fas fa-lock me-2"></i>Confirm Password
                                </label>
                                <input type="password" 
                                       class="form-control form-control-lg" 
                                       name="confirm_password" 
                                       id="confirmPassword"
                                       placeholder="Confirm new password"
                                       required>
                                <small class="form-text" id="matchStatus"></small>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 btn-lg">
                                <i class="fas fa-check me-2"></i>Reset Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
